trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'redis-node-clone'

stages:
- stage: BuildAndTest
  displayName: 'Build & Test Application'
  jobs:
  - job: TestJob
    displayName: 'Run Core Engine Validation'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm ci
      displayName: 'Install Dependencies'

    - script: |
        node -e "require('./src/parser'); require('./src/store'); console.log('Core Redis engine validated successfully');"
      displayName: 'Validate Modules'

- stage: BuildDocker
  displayName: 'Build Container Image'
  dependsOn: BuildAndTest
  jobs:
  - job: DockerBuild
    displayName: 'Build OCI Image'
    steps:
    - script: |
        docker build -t $(imageName):$(Build.BuildId) .
        docker build -t $(imageName):latest .
      displayName: 'Build Docker Container'